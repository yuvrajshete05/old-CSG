<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Intelligent Career Guidance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet" />
    <style>
        /* --- Base Styles --- */
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #282c3a, #1e1e2f);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #eee;
            padding: 20px;
        }

        h1.main-title {
            color: #f0f0f3;
            font-size: clamp(24px, 5vw, 36px);
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative; /* Fixed from absolute for better mobile flow */
        }

        /* --- Form Container --- */
        .form-card {
            background: #2b2e44;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        h3 {
            margin: 0 0 30px 0;
            font-size: 26px;
            text-align: center;
            color: #65d1ba;
            letter-spacing: 1px;
        }

        /* --- Input Groups --- */
        .input-group {
            position: relative;
            margin-bottom: 35px;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #555a7b;
            color: #fff;
            padding: 10px 0;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        label {
            position: absolute;
            left: 0;
            top: 10px;
            color: #8a8c9f;
            transition: 0.3s ease all;
            pointer-events: none;
        }

        /* Float Label Logic */
        input:focus + label,
        input:not(:placeholder-shown) + label {
            top: -20px;
            font-size: 12px;
            color: #65d1ba;
            font-weight: 600;
        }

        input:focus {
            border-bottom-color: #65d1ba;
        }

        /* --- Toast Notification Styles --- */
        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            animation: slideDown 0.4s ease-out;
            max-width: 90%;
            word-wrap: break-word;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .alert-error { background: #ff6b6b; color: white; border: 1px solid #c92a2a; }
        .alert-success { background: #51cf66; color: white; border: 1px solid #2f9e44; }
        .alert-info { background: #4dabf7; color: white; border: 1px solid #1971c2; }

        /* --- Submit Button --- */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #65d1ba, #3aa1b0);
            border: none;
            border-radius: 30px;
            color: #1f2a34;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(101, 209, 186, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(101, 209, 186, 0.6);
        }

        button:active {
            transform: scale(0.98);
        }

        /* --- Links --- */
        .footer-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #8a8c9f;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .footer-link span {
            color: #65d1ba;
            font-weight: 600;
        }

        .footer-link:hover span {
            color: #3aa1b0;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1 class="main-title">Intelligent Career Guidance System</h1>

<div class="form-card">
    <form id="loginForm" method="post">
        {% csrf_token %}
        <h3>Login Here</h3>

        {% if messages %}
        <div id="message-container">
            {% for message in messages %}
                <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="input-group">
            <input type="text" id="username" name="username" placeholder=" " required />
            <label for="username">Username</label>
        </div>

        <div class="input-group">
            <input type="password" id="password" name="pass" placeholder=" " required />
            <label for="password">Password</label>
        </div>

        <button type="submit" id="loginBtn">Log In</button>
        
        <a href="{% url 'signup' %}" class="footer-link">Don't have an account? <span>Create one</span></a>
    </form>
</div>

<script>
    // Auto-hide toast messages after 5 seconds
    const alerts = document.querySelectorAll('.alert');
    alerts.forEach(alert => {
        setTimeout(() => {
            alert.style.animation = 'fadeOut 0.4s ease-out forwards';
            setTimeout(() => {
                alert.remove();
            }, 400);
        }, 5000);
    });

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.onsubmit = function() {
        // Simple UI feedback
        loginBtn.innerHTML = "Authenticating...";
        loginBtn.style.opacity = "0.8";
        loginBtn.style.cursor = "wait";
    };
</script>

</body>
</html>
